name: Bug report
description: Something in the template does not do what it says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a **security** flaw? Close this and use
        [private vulnerability reporting](https://github.com/gabrielmissio/aws-agentic-app-starter/security/advisories/new)
        instead — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead. Paste the error verbatim — a truncated one costs a round trip.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The commands you ran, in order, starting from a clean clone where you can.
      placeholder: |
        1. npm run bootstrap
        2. cp infra/.env.example infra/.env, set PROJECT_NAME=…
        3. npm run deploy
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Where
      multiple: true
      options:
        - infra (CDK)
        - agent (Strands / AgentCore Runtime)
        - chatbot-bff (Lambda BFF)
        - chatbot-frontend (React)
        - Repository tooling (CI, scripts, docs)
        - Not sure
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: DEPLOY_PROFILE
      description: demo, pilot or prod. The gate's behavior differs between them, so this changes the answer.
      placeholder: demo
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
      placeholder: 87b361d
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node and npm versions (`node -v`, `npm -v`), OS, and AWS region.
      placeholder: node v22.14.0, npm 10.9.2, macOS 15.3 (arm64), us-east-1
    validations:
      required: true

  - type: textarea
    id: checks
    attributes:
      label: Does `npm run verify` pass?
      description: Run it and paste the tail of the output if it fails. It needs no AWS credentials, no Docker and no browser.

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: Relevant `.env` values with secrets and account ids removed, a synthesized template excerpt, CloudWatch logs.
