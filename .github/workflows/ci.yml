name: CI

# The pull-request gate. Three concerns, deliberately in three jobs so a failure names which one:
# `verify` is what a contributor already ran locally (see the root README's "Root scripts" table),
# `secrets` and `sast` are the two checks that cannot be run usefully on a laptop.
#
# Nothing here needs AWS credentials, Docker or a browser: the infra suite synthesizes all four
# stacks, and CDK stages a container asset's build context at synth rather than building it, so no
# image is produced.
#
# A `cdk deploy` is a separate, credentialed concern and not a PR gate. A `cdk synth` job is not — it
# needs neither credentials nor Docker, and adding one is the open gap the root README names under
# "What this template leaves open".
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default, for every job. Without this the `GITHUB_TOKEN` carries whatever the
# repository's default is — historically write on everything — and a compromised dependency running
# during `npm ci` inherits it. A job that needs more asks for it, and the ask is reviewable.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung install or a test that waits forever costs a runner for six hours by default.
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit, not a tag. A tag is a mutable pointer the action's owner can
      # move at any time, so `@v4` means "whatever that repository decides it means today" — which
      # is a write-access-to-your-CI relationship with every action author. The comment records
      # which release the SHA was, so the pin is still readable by a human.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout action otherwise leaves the token in `.git/config` for the rest of the job,
          # where every later step — including anything `npm ci` executes — can read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
            chatbot-bff/package-lock.json
            chatbot-frontend/package-lock.json
            infra/package-lock.json

      - name: Install dependencies (root + every subpackage)
        run: npm run bootstrap

      - name: Lint, typecheck, test
        run: npm run verify

      # Gates on `high`, not `critical`. A remotely exploitable flaw in a dependency that handles
      # request bodies is routinely scored high, and a gate that only stops `critical` is a gate that
      # lets those through while reporting green.
      - name: Audit
        run: npm run audit

  # ── Secret scanning ──────────────────────────────────────────────────────────
  # `npm audit` says whether a dependency is vulnerable. It says nothing about whether this repository
  # is carrying a credential, and a secret committed once is leaked even after it is deleted — which is
  # why this scans history rather than the working tree.
  #
  # TruffleHog rather than gitleaks-action, for a reason specific to a template: gitleaks-action
  # requires a paid `GITLEAKS_LICENSE` for any repository owned by an *organization*, so most forks
  # that matter would inherit a gate that fails until someone buys a key. This one has no such
  # condition.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, because that is the point — a rotated-but-committed key is still in it.
          fetch-depth: 0
          persist-credentials: false

      - uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          # An empty base is what makes it scan every commit rather than a diff. Left as a diff scan,
          # the job passes on a secret that arrived before the pull request.
          base: ''
          head: HEAD
          # `verified,unknown` rather than `--only-verified`. Verification proves a credential is live,
          # so verified-only reports nothing for a key that has already been rotated — and the point of
          # scanning history is precisely to find those. The cost is false positives; a fork drowning in
          # them should narrow this rather than delete the job.
          extra_args: --results=verified,unknown

  # ── Static analysis ──────────────────────────────────────────────────────────
  # ESLint enforces style and a set of correctness rules; it is not a security analyser. CodeQL is,
  # and it is the one check here that reasons across files — a tainted value reaching a sink several
  # calls away is exactly what no lint rule in `eslint.config.mjs` can see.
  #
  # `security-extended` rather than the default suite: the default trades recall for precision, and on
  # a template the cost of a missed injection path is inherited by every fork.
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The only elevated grant in this workflow, and it is what uploads the results to the
      # repository's Security tab. Scoped to this job rather than raised at the top of the file.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build step and no dependency install: CodeQL analyses JavaScript and TypeScript from source.
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
