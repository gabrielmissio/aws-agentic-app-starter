name: Deploy

# Deploy-on-merge, OPT-IN. This workflow is additive: a clone that has not run the OIDC bootstrap
# (see infra/bootstrap/README.md) is unaffected. The `guard` job below detects that case and the
# whole workflow ends GREEN with a notice — it never fails a fork that has not opted in, and it never
# touches the credential-free `ci.yml` gate.
#
# Enable it by deploying infra/bootstrap once and setting AWS_DEPLOY_ROLE_ARN (+ the DEPLOY_* vars)
# on a GitHub Environment named `prod`.

on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab, for a deploy outside a merge.
  workflow_dispatch:

# Least privilege at the workflow level: read-only by default. The one job that needs an OIDC token
# raises `id-token: write` on itself, so no other job (nor a compromised action in one) can mint one.
permissions:
  contents: read

# Never cancel a deploy in flight — unlike CI, a half-applied CloudFormation change is worse than a
# queued one. Serialize instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap gate with NO credentials and NO environment: is CD configured at all? If
  # AWS_DEPLOY_ROLE_ARN is empty, the deploy job is skipped and this job prints how to enable it. A
  # fork sees green, not red.
  #
  # This job deliberately does NOT declare `environment: prod`: if the prod Environment has required
  # reviewers, naming it here would make this fork-friendliness check itself block on manual approval,
  # defeating its purpose. It reads AWS_DEPLOY_ROLE_ARN as a repository variable (set it at repo scope,
  # or mirror it at repo scope in addition to the Environment).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "CD is configured; the deploy job will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## CD not configured — nothing to deploy"
              echo ""
              echo "This repository has not opted in to deploy-on-merge, so this run did nothing (and that is fine)."
              echo ""
              echo "To enable it, deploy the one-time OIDC bootstrap and set the \`prod\` Environment variables —"
              echo "see \`infra/bootstrap/README.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.configured == 'true'
    # Native ARM64 runner: the agent stack builds an ARM64 (Graviton) container image asset, and CDK
    # builds it for the runner's own architecture at deploy time. Building natively on ARM64 is the
    # current best practice — it needs no QEMU/binfmt emulation (which is for multi-arch builds and is
    # 5-10x slower). NOTE for PRIVATE forks: GitHub-hosted ARM64 runners are free on public repos but
    # BILLED on private ones — if that is a problem, switch to `ubuntu-latest` and add a
    # `docker/setup-qemu-action` step before the deploy to emulate arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: prod
    # Only this job mints an OIDC token.
    permissions:
      id-token: write
      contents: read
    steps:
      # Pinned by SHA to the same releases ci.yml uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install (root + every subpackage)
        run: npm run bootstrap

      # OIDC: exchange the workflow's GitHub identity token for temporary AWS credentials by assuming
      # the bootstrap deploy role. No long-lived key is stored anywhere. role-duration-seconds is set
      # explicitly and MUST stay <= the role's maxSessionDuration (1h in github-oidc-stack.ts) — raise
      # both together if long image builds ever need more.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.DEPLOY_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          # Fail fast if the assumed role ever resolves to an unexpected account.
          mask-aws-account-id: true

      # infra's deploy script runs `dotenvx run -f .env --overload -- cdk deploy`, so it needs a .env
      # file. We materialize a minimal one from the Environment variables. --overload means these win;
      # app.ts reads the rest straight from process.env, which the job already carries.
      - name: Materialize infra/.env from Environment variables
        working-directory: infra
        env:
          DEPLOY_PROFILE: ${{ vars.DEPLOY_PROFILE }}
          DEPLOY_ACCOUNT: ${{ vars.DEPLOY_ACCOUNT }}
          DEPLOY_REGION: ${{ vars.DEPLOY_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          # Posture controls required under DEPLOY_PROFILE=prod. Set them on the prod Environment.
          # This list MUST cover every variable assertDeploymentPosture() in infra/src/config.ts can
          # refuse, or a prod deploy fails the gate despite the Environment being fully configured.
          PUBLIC_SIGNUP_ENABLED: ${{ vars.PUBLIC_SIGNUP_ENABLED }}
          COGNITO_MFA: ${{ vars.COGNITO_MFA }}
          COGNITO_THREAT_PROTECTION: ${{ vars.COGNITO_THREAT_PROTECTION }}
          RETAIN_DATA: ${{ vars.RETAIN_DATA }}
          TRACING_ENABLED: ${{ vars.TRACING_ENABLED }}
          GUARDRAIL_ENABLED: ${{ vars.GUARDRAIL_ENABLED }}
          AGENT_OBSERVABILITY_ENABLED: ${{ vars.AGENT_OBSERVABILITY_ENABLED }}
          TRANSACTION_SEARCH_ENABLED: ${{ vars.TRANSACTION_SEARCH_ENABLED }}
          CONVERSATION_RETENTION_DAYS: ${{ vars.CONVERSATION_RETENTION_DAYS }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          APP_URL: ${{ vars.APP_URL }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          WAF_ENABLED: ${{ vars.WAF_ENABLED }}
        run: |
          # Emit only the variables that were actually set, one KEY=value per line. Values come from
          # env: (not interpolated into this script), so there is no shell-injection surface; a value
          # with an embedded newline is rejected so it cannot inject a spurious second line.
          : > .env
          for key in DEPLOY_PROFILE DEPLOY_ACCOUNT DEPLOY_REGION PROJECT_NAME \
                     PUBLIC_SIGNUP_ENABLED COGNITO_MFA COGNITO_THREAT_PROTECTION RETAIN_DATA \
                     TRACING_ENABLED GUARDRAIL_ENABLED AGENT_OBSERVABILITY_ENABLED \
                     TRANSACTION_SEARCH_ENABLED CONVERSATION_RETENTION_DAYS ALERT_EMAIL \
                     ALLOWED_ORIGIN APP_URL BEDROCK_MODEL_ID MONTHLY_BUDGET_USD WAF_ENABLED; do
            value="${!key}"
            if [ -n "$value" ]; then
              if printf '%s' "$value" | grep -q $'\n'; then
                echo "::error::$key contains a newline; refusing to write .env." >&2
                exit 1
              fi
              printf '%s=%s\n' "$key" "$value" >> .env
            fi
          done
          echo "Wrote infra/.env with $(grep -c '=' .env) line(s)."

      # cdk deploy --all, keeping the broadening-approval guard (never deploy:no-approval). The
      # assumed-role credentials + aws-region above already provide the target account and region;
      # DEPLOY_ACCOUNT/REGION in .env make the config gate assert the target matches.
      - name: Deploy all stacks
        working-directory: infra
        run: npm run deploy
